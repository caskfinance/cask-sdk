[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "cask-sdk"
dynamic = ["version"]
description = "Cask SDK: fast, local entitlement checks"
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
python-source = "python"
module-name = "cask._cask"
features = ["pyo3/extension-module"]
