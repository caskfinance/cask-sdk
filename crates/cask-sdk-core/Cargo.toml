[package]
name = "cask-sdk-core"
description.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
name = "cask_sdk_core"

[dependencies]
arc-swap = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "gzip", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
cask-mock-server = { path = "../cask-mock-server" }
flate2 = "1"
tiny_http = "0.12"
