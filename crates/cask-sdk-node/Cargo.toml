[package]
name = "cask-sdk-node"
description.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[lib]
name = "cask_sdk_node"
crate-type = ["cdylib"]

[dependencies]
cask-sdk-core = { path = "../cask-sdk-core" }
napi = { version = "3.14.1", features = ["napi6"] }
napi-derive = "3.6.11"

[build-dependencies]
napi-build = "2"
