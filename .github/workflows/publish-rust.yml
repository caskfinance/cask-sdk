name: Publish Rust crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cask-sdk") | .version')
          if [ "v$CRATE_VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match crate version $CRATE_VERSION"
            exit 1
          fi
      - name: Test
        run: cargo test -p cask-sdk-core -p cask-sdk
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates
        # Publishes in dependency order (cask-sdk-core, then cask-sdk)
        run: cargo publish -p cask-sdk-core -p cask-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
